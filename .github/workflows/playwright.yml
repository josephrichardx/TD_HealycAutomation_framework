name: Playwright Tests
run-name: Playwright Tests - ${{ inputs.test_case }} on ${{ inputs.baseUrl }} (by @${{ github.actor }})
on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Select Target Base URL'
        required: true
        type: choice
        default: '-- Select Base URL --'
        options:
          - '-- Select Base URL --'
          - 'http://frontend-uat.healync.com'
          - 'http://release-uat.healync.com.s3-website.ap-south-1.amazonaws.com'
      test_case:
        description: 'Select Test Case to run'
        required: true
        type: choice
        default: '-- Select Test Case --'
        options:
          - '-- Select Test Case --'
          - 'ALL'
          - 'WF_CALADN_01.spec.js'
          - 'WF_CALADN_02.spec.js'
          - 'WF_CALADN_03.spec.js'
          - 'WF_CALADN_04.spec.js'
          - 'WF_CALADN_05.spec.js'
          - 'WF_CALADN_31.spec.js'
          - 'WF_CALADN_32.spec.js'
          - 'WF_CALADN_32A.spec.js'
          - 'WF_CALADN_33.spec.js'
          - 'WF_CALADN_33A.spec.js'
          - 'WF_CALADN_39.spec.js'
          - 'WF_CALADN_40.spec.js'
          - 'WF_CALADN_41.spec.js'
          - 'WF_CALADN_42.spec.js'
          - 'WF_CALADN_45.spec.js'
          - 'WF_CALADN_46.spec.js'
          - 'WF_CALADN_47.spec.js'
          - 'WF_CALADN_48.spec.js'
          - 'WF_CALADN_125.spec.js'
          - 'WF_CALADN_126.spec.js'
 
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ inputs.baseUrl }}" == "-- Select Base URL --" ] || [ "${{ inputs.test_case }}" == "-- Select Test Case --" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Please select both a Base URL and a Test Case before running."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
 
  setup:
    needs: validate
    if: needs.validate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          if [ "${{ inputs.test_case }}" == "ALL" ]; then
            # Scans the actual tests folder — no hardcoded/duplicated list to maintain
            FILES=$(ls tests/*.spec.js | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
            echo "matrix=$FILES" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"${{ inputs.test_case }}\"]" >> "$GITHUB_OUTPUT"
          fi
 
  test:
    needs: [validate, setup]
    if: needs.validate.outputs.proceed == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        test_case: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Test Case
      env:
        BASE_URL: ${{ inputs.baseUrl }}
      run: npx playwright test tests/${{ matrix.test_case }}
    - name: Upload HTML Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ matrix.test_case }}
        path: playwright-report/
        retention-days: 30
name: Playwright Tests
run-name: Playwright Tests - ${{ inputs.test_case }} (by @${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: 'Test case to run'
        required: true
        default: '03 WF_CALADN_03'
        type: choice
        options:
          - '01 WF_CALADN_01'
          - '02 WF_CALADN_02'
          - '03 WF_CALADN_03'
          - '04 WF_CALADN_04'
          - '05 WF_CALADN_05'
          - '31 WF_CALADN_31'
          - '32 WF_CALADN_32'
          - '32A WF_CALADN_32A'
          - '33 WF_CALADN_33'
          - '33A WF_CALADN_33A'
          - '39 WF_CALADN_39'
          - '40 WF_CALADN_40'
          - '41 WF_CALADN_41'
          - '42 WF_CALADN_42'
          - '45 WF_CALADN_45'
          - '46 WF_CALADN_46'
          - '47 WF_CALADN_47'
          - '48 WF_CALADN_48'
          - '125 WF_CALADN_125'
          - '126 WF_CALADN_126'

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Extract spec file name
      id: extract
      run: |
        # input looks like "32A WF_CALADN_32A" -> we just need the WF_CALADN_xxx part
        TEST_CASE="${{ inputs.test_case }}"
        SPEC_NAME="${TEST_CASE#* }"
        echo "spec_name=$SPEC_NAME" >> "$GITHUB_OUTPUT"

    - name: Run Selected Test Case
      run: npx playwright test tests/${{ steps.extract.outputs.spec_name }}.spec.js

    - name: Upload HTML Report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
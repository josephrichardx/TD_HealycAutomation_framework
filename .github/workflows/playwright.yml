name: Playwright Tests

run-name: Playwright Tests

on:
  workflow_dispatch:
    inputs:

      baseUrl:
        description: 'Select Target Base URL'
        required: true
        type: choice
        default: 'http://release-uat.healync.com.s3-website.ap-south-1.amazonaws.com'
        options:
          - '-- Select Base URL --'
          - 'http://frontend-uat.healync.com'
          - 'http://release-uat.healync.com.s3-website.ap-south-1.amazonaws.com'

      run_all:
        description: 'Run ALL test cases'
        required: false
        type: boolean
        default: false

      Healync_E2E:
        description: 'Run Healync_E2E.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_01:
        description: 'Run WF_CALADN_01.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_02:
        description: 'Run WF_CALADN_02.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_03:
        description: 'Run WF_CALADN_03.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_04:
        description: 'Run WF_CALADN_04.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_05:
        description: 'Run WF_CALADN_05.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_31:
        description: 'Run WF_CALADN_31.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_32:
        description: 'Run WF_CALADN_32.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_32A:
        description: 'Run WF_CALADN_32A.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_33:
        description: 'Run WF_CALADN_33.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_33A:
        description: 'Run WF_CALADN_33A.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_39:
        description: 'Run WF_CALADN_39.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_40:
        description: 'Run WF_CALADN_40.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_41:
        description: 'Run WF_CALADN_41.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_42:
        description: 'Run WF_CALADN_42.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_45:
        description: 'Run WF_CALADN_45.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_46:
        description: 'Run WF_CALADN_46.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_47:
        description: 'Run WF_CALADN_47.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_48:
        description: 'Run WF_CALADN_48.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_125:
        description: 'Run WF_CALADN_125.spec.js'
        required: false
        type: boolean
        default: false

      WF_CALADN_126:
        description: 'Run WF_CALADN_126.spec.js'
        required: false
        type: boolean
        default: false


jobs:

  validate:
    runs-on: ubuntu-latest

    outputs:
      proceed: ${{ steps.check.outputs.proceed }}

    steps:
      - id: check
        shell: bash
        run: |

          if [ "${{ inputs.baseUrl }}" == "-- Select Base URL --" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Please select a Base URL."
            exit 1
          fi

          if [ "${{ inputs.run_all }}" != "true" ] && \
             [ "${{ inputs.Healync_E2E }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_01 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_02 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_03 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_04 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_05 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_31 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_32 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_32A }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_33 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_33A }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_39 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_40 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_41 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_42 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_45 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_46 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_47 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_48 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_125 }}" != "true" ] && \
             [ "${{ inputs.WF_CALADN_126 }}" != "true" ]; then

            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Please select at least one test case."
            exit 1
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"


  setup:
    needs: validate
    if: needs.validate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        shell: bash
        run: |

          if [ "${{ inputs.run_all }}" == "true" ]; then

            FILES=$(find tests -maxdepth 1 -name "*.spec.js" -type f \
              -printf "%f\n" | jq -R -s -c 'split("\n")[:-1]')

            echo "matrix=$FILES" >> "$GITHUB_OUTPUT"

          else

            TESTS=""

            if [ "${{ inputs.Healync_E2E }}" == "true" ]; then
              TESTS="${TESTS}\"Healync_E2E.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_01 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_01.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_02 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_02.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_03 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_03.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_04 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_04.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_05 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_05.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_31 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_31.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_32 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_32.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_32A }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_32A.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_33 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_33.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_33A }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_33A.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_39 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_39.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_40 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_40.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_41 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_41.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_42 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_42.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_45 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_45.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_46 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_46.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_47 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_47.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_48 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_48.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_125 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_125.spec.js\","
            fi

            if [ "${{ inputs.WF_CALADN_126 }}" == "true" ]; then
              TESTS="${TESTS}\"WF_CALADN_126.spec.js\","
            fi

            TESTS="[${TESTS%,}]"

            echo "matrix=$TESTS" >> "$GITHUB_OUTPUT"

          fi


  test:
    needs: [validate, setup]
    if: needs.validate.outputs.proceed == 'true'

    timeout-minutes: 10

    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false

      matrix:
        test_case: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Test Case
        env:
          BASE_URL: ${{ inputs.baseUrl }}
          PLAYWRIGHT_REPORT_DIR: playwright-report-${{ matrix.test_case }}

        run: |
          npx playwright test tests/${{ matrix.test_case }}

      - name: Upload HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.test_case }}
          path: playwright-report-${{ matrix.test_case }}/
          retention-days: 30